site_name: My Docs and Boilerplates
site_url: https://docs.dkcdev.me

theme:
  name: material
  palette:
    
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      primary: green
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: green
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.instant
    # - navigation.tabs
    # - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    # - navigation.toc
    # - toc.follow

    - search.suggest
    # - search.highlight

    - content.code.copy

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
